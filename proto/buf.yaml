version: v2

# proto 是独立发布的协议模块，Buf 配置不依赖仓库中的其他服务。
modules:
  - path: .

lint:
  use:
    - STANDARD
  # AdminService and UserService intentionally reuse the domain request and
  # response messages owned by UserService and LlmService.
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE

breaking:
  use:
    - FILE
