syntax = "proto3";

package admin.v1;

import "common/v1/security.proto";
import "llm/v1/llm.proto";
import "user/v1/user.proto";

option go_package = "github.com/Erain-byte/grpc_go_project/proto/admin/v1;adminv1";

service AdminService {
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (common.v1.auth) = {
      public: true
    };
  }

  // 未声明 public，默认要求 Gateway 传递可信的用户身份。
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  rpc GetAdminInfo(GetAdminInfoRequest) returns (GetAdminInfoResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super_admin"
    };
  }

  rpc CreateAdmin(CreateAdminRequest) returns (CreateAdminResponse) {
    option (common.v1.auth) = {
      roles: "super_admin"
    };
  }

  rpc GetAdminList(GetAdminListRequest) returns (GetAdminListResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super_admin"
    };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (common.v1.auth) = {
      public: true
    };
  }

  // User management operations forwarded by Admin to UserService.
  rpc GetUserInfo(user.v1.GetUserInfoRequest) returns (user.v1.GetUserInfoResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super_admin"
    };
  }

  rpc GetUserList(user.v1.GetUserListRequest) returns (user.v1.GetUserListResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super_admin"
    };
  }

  // Model operations forwarded by Admin to LlmService.
  rpc Chat(llm.v1.ChatRequest) returns (llm.v1.ChatResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super_admin"
    };
  }

  rpc StreamChat(llm.v1.StreamChatRequest) returns (stream llm.v1.StreamChatResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super_admin"
    };
  }
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 access_expires_in = 4;
  int64 refresh_expires_in = 5;
  string session_id = 6;
  Admin admin = 7;
}

message LogoutRequest {
  // Access Token 改由 Gateway 通过受 mTLS 保护的 gRPC metadata 传递。
  reserved 1;
  reserved "access_token";
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message GetAdminInfoRequest {
  // 当前管理员身份由认证中间件写入 context，不再放入业务请求体。
  reserved 1;
  reserved "access_token";
}

message GetAdminInfoResponse {
  bool success = 1;
  string message = 2;
  Admin admin_info = 3;
}

message CreateAdminRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  AdminRole role = 4;
}

message CreateAdminResponse {
  bool success = 1;
  string message = 2;
  Admin admin = 3;
}

message GetAdminListRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message GetAdminListResponse {
  repeated Admin admins = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message Admin {
  string id = 1;
  string username = 2;
  string email = 3;
  AdminRole role = 4;
}

enum AdminRole {
  ADMIN_ROLE_UNSPECIFIED = 0;
  ADMIN_ROLE_SUPER_ADMIN = 1;
  ADMIN_ROLE_ADMIN = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 access_expires_in = 4;
  int64 refresh_expires_in = 5;
}
