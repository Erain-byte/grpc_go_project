syntax = "proto3";

package web3.v1;

import "common/v1/security.proto";
import "google/protobuf/timestamp.proto";
import "web3/v1/product.proto";

option go_package = "github.com/Erain-byte/grpc_go_project/proto/web3/v1;web3v1";

// Web3Service 提供用户钱包绑定与只读链上查询。
// 当前用户身份来自经过验证的 gRPC metadata，不由请求体传入。
service Web3Service {
  // GetPublicWeb3Config 返回可以公开给客户端的产品配置。
  rpc GetPublicWeb3Config(GetPublicWeb3ConfigRequest) returns (GetPublicWeb3ConfigResponse) {
    option (common.v1.auth) = {
      public: true
    };
  }

  // RecordClientEvent 记录不包含钱包地址和资产信息的匿名漏斗事件。
  rpc RecordClientEvent(RecordClientEventRequest) returns (RecordClientEventResponse) {
    option (common.v1.auth) = {
      public: true
    };
  }

  // SubmitFeedback 接收用户主动填写的最小反馈信息。
  rpc SubmitFeedback(SubmitFeedbackRequest) returns (SubmitFeedbackResponse) {
    option (common.v1.auth) = {
      public: true
    };
  }

  // GetSupportedChains 返回当前服务已启用的链及其确认策略。
  rpc GetSupportedChains(GetSupportedChainsRequest) returns (GetSupportedChainsResponse) {
    option (common.v1.auth) = {
      roles: "user"
      roles: "admin"
      roles: "super-admin"
    };
  }

  // CreateBindingNonce 创建一次性签名消息。
  rpc CreateBindingNonce(CreateBindingNonceRequest) returns (CreateBindingNonceResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  // BindWallet 验证钱包签名并把钱包绑定到当前用户。
  rpc BindWallet(BindWalletRequest) returns (BindWalletResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  // UnbindWallet 解除当前用户拥有的钱包绑定。
  rpc UnbindWallet(UnbindWalletRequest) returns (UnbindWalletResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  // GetWallets 返回当前用户已经绑定的钱包。
  rpc GetWallets(GetWalletsRequest) returns (GetWalletsResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  // UpdateWallet 修改当前用户钱包的备注或默认状态。
  rpc UpdateWallet(UpdateWalletRequest) returns (UpdateWalletResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  // GetBalance 查询已绑定钱包的原生币或代币余额。
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse) {
    option (common.v1.auth) = {
      roles: "user"
      roles: "admin"
      roles: "super-admin"
    };
  }

  // GetTransaction 查询指定链上的交易状态。
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse) {
    option (common.v1.auth) = {
      roles: "user"
      roles: "admin"
      roles: "super-admin"
    };
  }

  // GetTransactions 分页查询已绑定钱包的交易记录。
  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse) {
    option (common.v1.auth) = {
      roles: "user"
      roles: "admin"
      roles: "super-admin"
    };
  }

  // CheckTronUSDTApprovals 查询公开 TRON 主网地址的 USDT 授权情况。
  // 查询不要求证明地址归属，也不会创建签名或广播链上交易。
  rpc CheckTronUSDTApprovals(CheckTronUSDTApprovalsRequest) returns (CheckTronUSDTApprovalsResponse) {
    option (common.v1.auth) = {
      public: true
    };
  }

  // CheckEvmAirdrops 是 B 包的匿名 EVM 空投查询入口。
  rpc CheckEvmAirdrops(CheckEvmAirdropsRequest) returns (CheckEvmAirdropsResponse) {
    option (common.v1.auth) = {
      public: true
    };
  }

  // GetWeb3UsageSummary 返回钱包体检的聚合用量，不返回地址明细。
  rpc GetWeb3UsageSummary(GetWeb3UsageSummaryRequest) returns (GetWeb3UsageSummaryResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super-admin"
    };
  }

  // GetWeb3RuntimeStatus 返回功能开关和上游运行状态，不返回密钥。
  rpc GetWeb3RuntimeStatus(GetWeb3RuntimeStatusRequest) returns (GetWeb3RuntimeStatusResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super-admin"
    };
  }

  // GetFeedbackList 返回用户反馈的分页列表。
  rpc GetFeedbackList(GetFeedbackListRequest) returns (GetFeedbackListResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super-admin"
    };
  }
}

message CheckTronUSDTApprovalsRequest {
  // address 必须是通过 Base58Check 校验的 TRON 主网地址。
  string address = 1;

  // installation_id 是随机安装标识，仅用于匿名限流和统计，不能作为身份凭证。
  string installation_id = 2;
  string app_version = 3;
  ClientPlatform platform = 4;
}

message CheckTronUSDTApprovalsResponse {
  string request_id = 1;
  string network = 2;
  string address = 3;
  string token_contract = 4;
  TronApprovalCheckStatus status = 5;

  // 以下字段分别描述枚举、额度核实和风险数据是否完整可用。
  // 客户端必须依据这些字段区分完整空结果、部分结果和查询失败。
  bool enumeration_complete = 6;
  bool allowance_verification_complete = 7;
  bool risk_data_available = 8;
  bool truncated = 9;
  string reason = 10;

  bool is_cached = 11;
  google.protobuf.Timestamp queried_at = 12;
  repeated TronUSDTApproval approvals = 13;
  repeated TronApprovalPartialError partial_errors = 14;
  QueryFailure failure = 15;
}

enum TronApprovalCheckStatus {
  TRON_APPROVAL_CHECK_STATUS_UNSPECIFIED = 0;
  TRON_APPROVAL_CHECK_STATUS_SUCCESS = 1;
  TRON_APPROVAL_CHECK_STATUS_PARTIAL = 2;
  TRON_APPROVAL_CHECK_STATUS_FAILED = 3;
}

message TronUSDTApproval {
  string spender = 1;
  TronSpenderType spender_type = 2;
  string display_name = 3;

  // raw_allowance 保存链上最小单位的大整数十进制字符串，禁止使用浮点数。
  string raw_allowance = 4;
  uint32 decimals = 5;
  string display_allowance = 6;
  TronUnlimitedStatus unlimited_status = 7;
  google.protobuf.Timestamp allowance_verified_at = 8;

  // 风险标签与授权额度彼此独立；没有标签不等于风险数据不可用。
  repeated string risk_labels = 9;
  string risk_source = 10;
  google.protobuf.Timestamp risk_checked_at = 11;
  bool allowance_verified = 12;
  bool active = 13;
  string official_detail_url = 14;
}

enum TronSpenderType {
  TRON_SPENDER_TYPE_UNSPECIFIED = 0;
  TRON_SPENDER_TYPE_ADDRESS = 1;
  TRON_SPENDER_TYPE_CONTRACT = 2;
  TRON_SPENDER_TYPE_UNKNOWN = 3;
}

enum TronUnlimitedStatus {
  TRON_UNLIMITED_STATUS_UNSPECIFIED = 0;
  TRON_UNLIMITED_STATUS_FINITE = 1;
  TRON_UNLIMITED_STATUS_UNLIMITED = 2;
  TRON_UNLIMITED_STATUS_CONFLICT = 3;
  TRON_UNLIMITED_STATUS_UNKNOWN = 4;
}

message TronApprovalPartialError {
  string code = 1;
  string message = 2;
  bool retryable = 3;

  // spender 为空表示错误属于整个查询或分页，不对应单个授权对象。
  string spender = 4;
}

message GetSupportedChainsRequest {}

message GetSupportedChainsResponse {
  repeated ChainInfo chains = 1;
}

message ChainInfo {
  uint64 chain_id = 1;
  string name = 2;
  string native_symbol = 3;
  uint32 native_decimals = 4;
  bool enabled = 5;
  uint64 required_confirmations = 6;
}

message CreateBindingNonceRequest {
  // EVM 网络使用链 ID，例如 Ethereum Mainnet 为 1。
  uint64 chain_id = 1;
  string address = 2;
}

message CreateBindingNonceResponse {
  // nonce_id 用于后续绑定请求，服务端据此读取并原子消费 Redis 中的 nonce。
  string nonce_id = 1;
  string signing_message = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message BindWalletRequest {
  uint64 chain_id = 1;
  string address = 2;
  string nonce_id = 3;
  string signature = 4;
  string label = 5;
}

message BindWalletResponse {
  WalletInfo wallet = 1;
  bool newly_bound = 2;
}

message UnbindWalletRequest {
  string wallet_id = 1;
}

message UnbindWalletResponse {}

message GetWalletsRequest {}

message GetWalletsResponse {
  repeated WalletInfo wallets = 1;
}

message WalletInfo {
  string id = 1;
  uint64 chain_id = 2;
  string address = 3;
  string label = 4;
  WalletStatus status = 5;
  google.protobuf.Timestamp verified_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  bool is_default = 9;
}

enum WalletStatus {
  WALLET_STATUS_UNSPECIFIED = 0;
  WALLET_STATUS_ACTIVE = 1;
  WALLET_STATUS_DISABLED = 2;
}

message UpdateWalletRequest {
  string wallet_id = 1;

  // optional 用于区分“未修改”与“显式设置为空值或 false”。
  optional string label = 2;
  optional bool is_default = 3;
}

message UpdateWalletResponse {
  WalletInfo wallet = 1;
}

message GetBalanceRequest {
  string wallet_id = 1;

  // token_contract 为空时查询网络原生币，非空时查询该合约代币。
  string token_contract = 2;
}

message GetBalanceResponse {
  uint64 chain_id = 1;
  string address = 2;
  string token_contract = 3;
  string symbol = 4;
  uint32 decimals = 5;

  // raw_balance 是最小单位整数，formatted_balance 是按 decimals 格式化后的十进制数。
  // 两者均使用字符串，避免浮点数精度损失。
  string raw_balance = 6;
  string formatted_balance = 7;
  google.protobuf.Timestamp observed_at = 8;
}

message GetTransactionRequest {
  uint64 chain_id = 1;
  string transaction_hash = 2;

  // 指定交易所属的钱包，用于校验归属并确定交易分表。
  // 保留已有字段编号，新增字段必须使用新的编号以保证 protobuf 兼容性。
  string wallet_id = 3;
}

message GetTransactionResponse {
  TransactionInfo transaction = 1;
}

message GetTransactionsRequest {
  string wallet_id = 1;
  int32 page = 2;
  int32 page_size = 3;

  // UNSPECIFIED 表示不过滤交易状态。
  TransactionStatus status = 4;
}

message GetTransactionsResponse {
  repeated TransactionInfo transactions = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message TransactionInfo {
  uint64 chain_id = 1;
  string transaction_hash = 2;
  string from_address = 3;
  string to_address = 4;

  // value 使用链上最小单位的十进制整数字符串。
  string value = 5;
  uint64 block_number = 6;
  string block_hash = 7;
  uint64 confirmations = 8;
  TransactionStatus status = 9;
  google.protobuf.Timestamp block_time = 10;

  // token_contract 为空表示网络原生币；非空表示 ERC-20 合约地址。
  string token_contract = 11;
  // event_index=-1 表示原生币交易；非负值表示 ERC-20 Transfer 的链上 log_index。
  int32 event_index = 12;
}

enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_PENDING = 1;
  TRANSACTION_STATUS_CONFIRMED = 2;
  TRANSACTION_STATUS_FAILED = 3;
  TRANSACTION_STATUS_REORGED = 4;
}
