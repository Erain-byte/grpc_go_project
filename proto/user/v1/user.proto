syntax = "proto3";

package user.v1;

import "common/v1/security.proto";
import "google/protobuf/timestamp.proto";
import "llm/v1/llm.proto";

option go_package = "github.com/Erain-byte/grpc_go_project/proto/user/v1;userv1";

service UserService {
  // InitializeUser creates the local business user after Keycloak login.
  // Repeated calls for the same authenticated subject are idempotent.
  rpc InitializeUser(InitializeUserRequest) returns (InitializeUserResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse) {
    option (common.v1.auth) = {
      roles: "user"
      roles: "admin"
      roles: "super-admin"
    };
  }

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super-admin"
    };
  }

  rpc GetUserList(GetUserListRequest) returns (GetUserListResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super-admin"
    };
  }

  rpc Chat(llm.v1.ChatRequest) returns (llm.v1.ChatResponse) {
    option (common.v1.auth) = {
      roles: "user"
      roles: "admin"
      roles: "super-admin"
    };
  }

  rpc StreamChat(llm.v1.StreamChatRequest) returns (stream llm.v1.StreamChatResponse) {
    option (common.v1.auth) = {
      roles: "user"
      roles: "admin"
      roles: "super-admin"
    };
  }
}

message InitializeUserRequest {}

message InitializeUserResponse {
  UserInfo user_info = 1;
  bool newly_created = 2;
}

message GetUserInfoRequest {
  // The authenticated identity is carried in trusted gRPC metadata.
  reserved 1;
  reserved "access_token";
}

message GetUserInfoResponse {
  bool success = 1;
  string message = 2;
  UserInfo user_info = 3;
}

message UserInfo {
  string id = 1;
  string username = 2;
  google.protobuf.Timestamp created_at = 3;
  UserStatus status = 4;
  string nickname = 5;
  string avatar_url = 6;
  string phone = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp last_login_at = 9;
  string email = 10;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_DISABLED = 2;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string email = 3;
}

message CreateUserResponse {
  bool success = 1;
  string message = 2;
  UserInfo user_info = 3;
}

message GetUserListRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message GetUserListResponse {
  bool success = 1;
  string message = 2;
  repeated UserInfo user_list = 3;
  int64 total = 4;
  int32 page = 5;
  int32 page_size = 6;
}
