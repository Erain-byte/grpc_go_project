syntax = "proto3";

package user.v1;

import "common/v1/security.proto";
import "google/protobuf/timestamp.proto";
import "llm/v1/llm.proto";
import "web3/v1/product.proto";
import "web3/v1/web3.proto";

option go_package = "github.com/Erain-byte/grpc_go_project/proto/user/v1;userv1";

service UserService {
  // 钱包体检公共产品配置，由 UserService 转发给 Web3Service。
  rpc GetPublicWeb3Config(web3.v1.GetPublicWeb3ConfigRequest) returns (web3.v1.GetPublicWeb3ConfigResponse) {
    option (common.v1.auth) = {
      public: true
    };
  }

  rpc RecordClientEvent(web3.v1.RecordClientEventRequest) returns (web3.v1.RecordClientEventResponse) {
    option (common.v1.auth) = {
      public: true
    };
  }

  rpc SubmitFeedback(web3.v1.SubmitFeedbackRequest) returns (web3.v1.SubmitFeedbackResponse) {
    option (common.v1.auth) = {
      public: true
    };
  }

  // InitializeUser creates the local business user after Keycloak login.
  // Repeated calls for the same authenticated subject are idempotent.
  rpc InitializeUser(InitializeUserRequest) returns (InitializeUserResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse) {
    option (common.v1.auth) = {
      roles: "user"
      roles: "admin"
      roles: "super-admin"
    };
  }

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super-admin"
    };
  }

  rpc GetUserList(GetUserListRequest) returns (GetUserListResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super-admin"
    };
  }

  rpc Chat(llm.v1.ChatRequest) returns (llm.v1.ChatResponse) {
    option (common.v1.auth) = {
      roles: "user"
      roles: "admin"
      roles: "super-admin"
    };
  }

  rpc StreamChat(llm.v1.StreamChatRequest) returns (stream llm.v1.StreamChatResponse) {
    option (common.v1.auth) = {
      roles: "user"
      roles: "admin"
      roles: "super-admin"
    };
  }

  // Web3 wallet operations forwarded by UserService to Web3Service.
  rpc GetSupportedChains(web3.v1.GetSupportedChainsRequest) returns (web3.v1.GetSupportedChainsResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  rpc CreateBindingNonce(web3.v1.CreateBindingNonceRequest) returns (web3.v1.CreateBindingNonceResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  rpc BindWallet(web3.v1.BindWalletRequest) returns (web3.v1.BindWalletResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  rpc UnbindWallet(web3.v1.UnbindWalletRequest) returns (web3.v1.UnbindWalletResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  rpc GetWallets(web3.v1.GetWalletsRequest) returns (web3.v1.GetWalletsResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  rpc UpdateWallet(web3.v1.UpdateWalletRequest) returns (web3.v1.UpdateWalletResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  rpc GetBalance(web3.v1.GetBalanceRequest) returns (web3.v1.GetBalanceResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  rpc GetTransaction(web3.v1.GetTransactionRequest) returns (web3.v1.GetTransactionResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  rpc GetTransactions(web3.v1.GetTransactionsRequest) returns (web3.v1.GetTransactionsResponse) {
    option (common.v1.auth) = {
      roles: "user"
    };
  }

  // 公开 TRON USDT 授权体检，由 UserService 转发给 Web3Service。
  rpc CheckTronUSDTApprovals(web3.v1.CheckTronUSDTApprovalsRequest) returns (web3.v1.CheckTronUSDTApprovalsResponse) {
    option (common.v1.auth) = {
      public: true
    };
  }

  rpc CheckEvmAirdrops(web3.v1.CheckEvmAirdropsRequest) returns (web3.v1.CheckEvmAirdropsResponse) {
    option (common.v1.auth) = {
      public: true
    };
  }

  rpc GetWeb3UsageSummary(web3.v1.GetWeb3UsageSummaryRequest) returns (web3.v1.GetWeb3UsageSummaryResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super-admin"
    };
  }

  rpc GetWeb3RuntimeStatus(web3.v1.GetWeb3RuntimeStatusRequest) returns (web3.v1.GetWeb3RuntimeStatusResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super-admin"
    };
  }

  rpc GetFeedbackList(web3.v1.GetFeedbackListRequest) returns (web3.v1.GetFeedbackListResponse) {
    option (common.v1.auth) = {
      roles: "admin"
      roles: "super-admin"
    };
  }
}

message InitializeUserRequest {}

message InitializeUserResponse {
  UserInfo user_info = 1;
  bool newly_created = 2;
}

message GetUserInfoRequest {
  // The authenticated identity is carried in trusted gRPC metadata.
  reserved 1;
  reserved "access_token";

  // Only admin and super-admin callers may set this field to query a target
  // local user. An empty value means "the currently authenticated user".
  string user_id = 2;
}

message GetUserInfoResponse {
  bool success = 1;
  string message = 2;
  UserInfo user_info = 3;
}

message UserInfo {
  string id = 1;
  string username = 2;
  google.protobuf.Timestamp created_at = 3;
  UserStatus status = 4;
  string nickname = 5;
  string avatar_url = 6;
  string phone = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp last_login_at = 9;
  string email = 10;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_DISABLED = 2;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string email = 3;
}

message CreateUserResponse {
  bool success = 1;
  string message = 2;
  UserInfo user_info = 3;
}

message GetUserListRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message GetUserListResponse {
  bool success = 1;
  string message = 2;
  repeated UserInfo user_list = 3;
  int64 total = 4;
  int32 page = 5;
  int32 page_size = 6;
}
