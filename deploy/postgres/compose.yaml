services:
  keycloak-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      identity:
        aliases:
          - keycloak-postgres

networks:
  identity:
    name: grpc-go-identity
    external: true

volumes:
  keycloak-postgres-data:
    name: identity_keycloak-postgres-data
    external: true
