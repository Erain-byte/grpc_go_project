name: grpc-go-postgres-web3-prod

services:
  web3-postgres:
    image: postgres:17
    container_name: grpc-go-web3-postgres
    restart: always
    environment:
      POSTGRES_DB: ${WEB3_DB_NAME:-web3_service}
      POSTGRES_USER: ${WEB3_DB_USER:-web3_service}
      POSTGRES_PASSWORD: ${WEB3_DB_PASSWORD:?set WEB3_DB_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - grpc-go-web3-postgres-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - grpc-go-web3-database-prod

volumes:
  grpc-go-web3-postgres-data-prod:
    external: true

networks:
  grpc-go-web3-database-prod:
    external: true
