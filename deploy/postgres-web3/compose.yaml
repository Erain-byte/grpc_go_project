name: grpc-go-postgres-web3

services:
  web3-postgres:
    image: postgres:17
    container_name: grpc-go-web3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: web3_service
      POSTGRES_USER: web3_service
      POSTGRES_PASSWORD: ${WEB3_DB_PASSWORD:?set WEB3_DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - grpc-go-web3-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web3_service -d web3_service"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - grpc-go-web3-database

volumes:
  grpc-go-web3-postgres-data:
    external: true

networks:
  grpc-go-web3-database:
    external: true
