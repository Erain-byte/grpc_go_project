# Standalone production template. It is loaded only when explicitly selected.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?set KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME: https://${KEYCLOAK_HOSTNAME:?set KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      USER_WEB_CLIENT_SECRET: ${USER_WEB_CLIENT_SECRET:?set USER_WEB_CLIENT_SECRET}
      ADMIN_WEB_CLIENT_SECRET: ${ADMIN_WEB_CLIENT_SECRET:?set ADMIN_WEB_CLIENT_SECRET}
    ports:
      - "127.0.0.1:8180:8080"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./realm/grpc-project-realm.template.json:/opt/keycloak/data/import/grpc-project-realm.json:ro
    networks:
      - identity-prod

networks:
  identity-prod:
    name: grpc-go-identity-prod
    external: true
