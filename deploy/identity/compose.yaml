services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      USER_WEB_CLIENT_SECRET: ${USER_WEB_CLIENT_SECRET:?set USER_WEB_CLIENT_SECRET}
      ADMIN_WEB_CLIENT_SECRET: ${ADMIN_WEB_CLIENT_SECRET:?set ADMIN_WEB_CLIENT_SECRET}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # 固定浏览器可访问的 OIDC Issuer。容器内 Token 兑换/刷新仍通过内部网络访问，
      # 但 Keycloak 必须始终使用同一个 Issuer 校验和签发 Token。
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "127.0.0.1:8180:8080"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./realm/grpc-project-realm.template.json:/opt/keycloak/data/import/grpc-project-realm.json:ro
    networks:
      - identity

networks:
  identity:
    name: grpc-go-identity
    external: true
