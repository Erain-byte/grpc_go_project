services:
  user-oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Keycloak
      OAUTH2_PROXY_CLIENT_ID: user-web
      OAUTH2_PROXY_CLIENT_SECRET: ${USER_WEB_CLIENT_SECRET:?set USER_WEB_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${USER_COOKIE_SECRET:?set USER_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_NAME: _grpc_user_session
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_REFRESH: 4m
      OAUTH2_PROXY_COOKIE_EXPIRE: 30m
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://redis:6379
      OAUTH2_PROXY_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:4180/oauth2/callback
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://localhost:8180/realms/grpc-project
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: http://localhost:8180/realms/grpc-project/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/grpc-project/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/grpc-project/protocol/openid-connect/certs
      OAUTH2_PROXY_SKIP_CLAIMS_FROM_PROFILE_URL: "true"
      OAUTH2_PROXY_SCOPE: openid profile email grpc-api-audience
      OAUTH2_PROXY_OIDC_EXTRA_AUDIENCES: grpc-api
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_ALLOWED_ROLES: user
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_UPSTREAMS: http://host.docker.internal:9080
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
    ports:
      - "127.0.0.1:4180:4180"
    networks:
      - identity
      - redis

  admin-oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Keycloak
      OAUTH2_PROXY_CLIENT_ID: admin-web
      OAUTH2_PROXY_CLIENT_SECRET: ${ADMIN_WEB_CLIENT_SECRET:?set ADMIN_WEB_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${ADMIN_COOKIE_SECRET:?set ADMIN_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_NAME: _grpc_admin_session
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_REFRESH: 4m
      OAUTH2_PROXY_COOKIE_EXPIRE: 30m
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://redis:6379
      OAUTH2_PROXY_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4181
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:4181/oauth2/callback
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://localhost:8180/realms/grpc-project
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: http://localhost:8180/realms/grpc-project/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/grpc-project/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/grpc-project/protocol/openid-connect/certs
      OAUTH2_PROXY_SKIP_CLAIMS_FROM_PROFILE_URL: "true"
      OAUTH2_PROXY_SCOPE: openid profile email grpc-api-audience
      OAUTH2_PROXY_OIDC_EXTRA_AUDIENCES: grpc-api
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_ALLOWED_ROLES: admin,super-admin
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_UPSTREAMS: http://host.docker.internal:9080
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
    ports:
      - "127.0.0.1:4181:4181"
    networks:
      - identity
      - redis

networks:
  identity:
    name: grpc-go-identity
    external: true
  redis:
    name: grpc-go-shared
    external: true
