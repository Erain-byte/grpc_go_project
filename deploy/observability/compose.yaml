services:
  consul:
    image: hashicorp/consul:latest
    container_name: grpc-go-consul
    command:
      - agent
      # 本地使用单节点 Server 模式，使 KV 数据可以写入持久化数据卷。
      - -server
      - -ui
      - -node=consul-server-1
      - -bootstrap-expect=1
      - -client=0.0.0.0
      - -data-dir=/consul/data
      # 加载健康检查客户端的 TLS 配置，不改变业务 KV 的配置方式。
      - -config-file=/consul/config/health-tls.hcl
    ports:
      # Consul HTTP API 和管理页面：http://127.0.0.1:8500
      - "8500:8500"
      # Consul DNS 接口，当前项目暂未使用。
      - "8600:8600/tcp"
      - "8600:8600/udp"
    volumes:
      # 保存 Consul KV、服务目录及 Raft 数据，重建容器后仍可恢复。
      - consul_data:/consul/data
      - ./consul/health-tls.hcl:/consul/config/health-tls.hcl:ro
      # 只挂载公共 CA 和 Consul 独立的客户端身份，绝不挂载 CA 私钥。
      - D:/local-pki/ca.crt:/consul/certs/ca.crt:ro
      - D:/local-pki/consul/client.crt:/consul/certs/client.crt:ro
      - D:/local-pki/consul/client.key:/consul/certs/client.key:ro
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: grpc-go-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # Gateway 和 Admin 使用的 OTLP gRPC 接收端口。
      - "4317:4317"
      # OTLP HTTP 接收端口，当前 Go 服务暂未使用。
      - "4318:4318"
      # Jaeger 查询页面：http://127.0.0.1:16686
      - "16686:16686"
    restart: unless-stopped
  
  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: grpc-go-rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: "grpc_app"
      RABBITMQ_DEFAULT_VHOST: "/grpc-go"
    ports:
      # Go 服务使用的 AMQP 端口。
      - "5672:5672"
      # RabbitMQ 管理页面：http://127.0.0.1:15672
      - "15672:15672"
    volumes:
      # 保存队列、交换机和持久化消息。
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  consul_data:
    # 固定当前已有卷；找不到就报错，避免因项目名变化创建空卷。
    name: observability_consul_data
    external: true
  rabbitmq_data:
    # 外部卷不会被 Compose down -v 删除；仍需避免手动删除并做好备份。
    name: observability_rabbitmq_data
    external: true
