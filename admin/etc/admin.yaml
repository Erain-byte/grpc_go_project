# Admin service configuration. Secrets are supplied through ADMIN_* environment variables.
environment: "development"
name: "admin-service"
version: "1.0.0"
host: "127.0.0.1"
grpc_port: 9082

database:
  driver: "mysql"
  host: "127.0.0.1"
  port: 3306
  username: "admindb"
 
  dbname: "admindb"
  charset: "utf8mb4"
  parse_time: true
  location: "Local"
  # false: all reads and writes use the primary database above.
  # true: writes use the primary database; reads may use the replicas below.
  read_write_split_enabled: false
  replica_addresses:
    # - "10.0.0.11:3306"
    # - "10.0.0.12:3306"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_idle_time: "10m"
  conn_max_lifetime: "1h"

redis:
  host: "127.0.0.1"
  port: 6379
  cluster_addresses: []
  db: 0
  pool_size: 100
  min_idle_conns: 10
  max_idle_conns: 50
  conn_max_idle_time: "30m"
  conn_max_lifetime: "1h"
  dial_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"
  pool_timeout: "4s"
  health_required: false

# RabbitMQ password is loaded from ADMIN_RABBITMQ_PASSWORD.
# RabbitMQ 操作日志异步链路；密码通过 ADMIN_RABBITMQ_PASSWORD 注入。
rabbitmq:
  enabled: true
  host: "127.0.0.1"
  port: 5672
  username: "grpc_app"
  vhost: "/grpc-go"
  connection_name: "admin-service"
  heartbeat: "30s"
  dial_timeout: "5s"
  reconnect_interval: "5s"
  publish_confirm_timeout: "5s"
  prefetch_count: 10
  # 主队列、延迟重试队列和死信队列的固定拓扑。
  operation_log:
    exchange: "admin.events"
    exchange_type: "topic"
    routing_key: "admin.operation_log.created"
    queue: "admin.operation_log"
    retry_exchange: "admin.events.retry"
    retry_routing_key: "admin.operation_log.retry"
    retry_queue: "admin.operation_log.retry"
    retry_delay: "5s" # 每次失败后等待 5 秒再投回主队列。
    max_retries: 3    # 超过次数后转入死信队列。
    dead_letter_exchange: "admin.events.dlx"
    dead_letter_routing_key: "admin.operation_log.dead"
    dead_letter_queue: "admin.operation_log.dlq"

# ADMIN_ACCESS_TOKEN_SECRET must match the Gateway verification secret.
auth:
  access_token:
    issuer: "admin-service"
    audience: "gateway"
    algorithm: "HS256"
    expire: "15m"
  refresh_token:
    expire: "168h"
    rotate: true
    reuse_detection: true
    redis_key_prefix: "admin:auth:refresh:"

consul:
  host: "127.0.0.1"
  port: 8500
  addresses: []
  scheme: "http"
  check_host: "host.docker.internal" # Docker Consul 通过该地址访问 Windows 上的 Admin
  check_interval: "10s"
  check_timeout: "5s"
  deregister_critical_after: "90s"

logger:
  level: "info"
  format: "json"
  filename: "logs/admin.log"
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true

shutdown:
  timeout: "10s"

# Inbound Admin gRPC transport security.
grpc:
  use_tls: false
  cert_file: ""
  key_file: ""
  client_ca_file: ""

tracing:
  enabled: true
  service_name: "admin-service"
  endpoint: "127.0.0.1:4317"
  sampler_type: "const"
  sampler_param: 1.0
  use_tls: false
  ca_file: ""
  cert_file: ""
  key_file: ""
  server_name: "jaeger" # 仅启用 TLS 时参与服务端证书名称验证
rate_limit:
  enabled: true

  # 每次限流查询 Redis 的最大等待时间。
  redis_timeout: "300ms"

  # Redis Key 前缀，用来隔离不同业务。
  key_prefix: "admin:rate_limit:"

  # 同一用户名一分钟最多尝试登录10次。
  login:
    limit: 10
    window: "1m"

  # 同一个 Refresh Token 一分钟最多刷新20次。
  refresh_token:
    limit: 20
    window: "1m"

  # 已登录管理员访问同一个RPC方法的默认限制。
  default:
    limit: 100
    window: "1m"