# Gateway Service Configuration
environment: "development" # development, staging, production
name: "gateway-service"
host: "127.0.0.1"
port: 9080
grpc_port: 9081
# 外部浏览器/客户端连接 Gateway 的 HTTPS 配置；证书准备好后开启。
http:
  tls:
    enabled: false
    cert_file: "D:/grpc_go_project/gateway/etc/certs/server.crt"
    key_file: "D:/grpc_go_project/gateway/etc/certs/server.key"
    # 仅本地测试 CA 使用；生产需让 Consul 信任 CA 并改为 false。
    health_check_skip_verify: true
    # 证书 SAN 包含 localhost、127.0.0.1；有效期由签发时决定。
#pprof configuration
pprof:
  enabled: true
  port: 6060
  host: "127.0.0.1"
# Redis Configuration
# 单节点模式：配置host+port，cluster_addresses留空
# 集群模式：配置cluster_addresses，host+port将被忽略
redis:
  host: "127.0.0.1"
  port: 6379
  cluster_addresses: []
  
  db: 0
  pool_size: 100
  min_idle_conns: 10
  max_idle_conns: 50
  conn_max_idle_time: "30m"
  conn_max_lifetime: "1h"
  dial_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"
  pool_timeout: "4s"
  health_required: false # set true in production, or use environment: production

# Gateway authentication configuration. Token values are never stored here.
# Set the JWT verification secret through GATEWAY_ACCESS_TOKEN_SECRET.
auth:
  access_token:
    issuers:
      - "admin-service"
      - "user-service"
    audience: "gateway"
    algorithm: "HS256"
    expire: "15m"
  refresh_token:
    expire: "168h"
    rotate: true
    reuse_detection: true
    redis_key_prefix: "auth:refresh:"
# Consul Configuration
# 单节点模式：配置host+port，addresses留空
# 集群模式：配置addresses，host+port将被忽略
consul:
  host: "localhost"
  port: 8500
  addresses: []
  token: ""
  scheme: "http"
  check_host: "host.docker.internal" # Docker Consul 通过该地址访问 Windows 上的 Gateway
  check_interval: "10s"
  check_timeout: "5s"
  ttl: "30s"
  deregister_critical_after: "90s"
  keepalive_interval: "10s"
  runtime_config_key: "grpc-go/config/gateway/runtime"
  runtime_config_required: true # CORS 只从 Consul KV 加载，缺失或非法时拒绝启动

# Logger Configuration
logger:
  level: "info"                     # 日志级别：debug, info, warn, error
  format: "json"                    # 日志格式：json, console
  filename: "logs/gateway.log"      # 日志文件路径
  max_size: 100                     # 单个日志文件最大大小（MB）
  max_backups: 10                   # 保留的旧日志文件数量
  max_age: 30                       # 日志文件保留天数
  compress: true                    # 是否压缩旧日志文件

# Service Configuration
service:
  version: "1.0.0"
  cors_enabled: true
  tags:
    - "http"
    - "gateway"
  public_apis:
    - "/health"
  auth_apis: []

# CORS 策略位于 Consul KV：grpc-go/config/gateway/runtime。
# Gateway 启动时读取并校验，配置缺失或非法时拒绝启动。
# HTTP 路由不从配置文件动态生成。
# 请在 internal/server/routes_*.go 中按业务模块注册路由。

# Shutdown Configuration
shutdown:
  timeout: "5s"

# gRPC Client Configuration
grpc:
  # 这是 Gateway 调用 Admin 的客户端配置，不是外部 HTTP 入口的 HTTPS 配置。
  # 证书生成后，与 Admin 的 grpc.use_tls 同时改为 true。
  use_tls: true
  insecure_skip_verify: false
  cert_file: "D:/grpc_go_project/gateway/etc/certs/client.crt"
  key_file: "D:/grpc_go_project/gateway/etc/certs/client.key"
  ca_file: "D:/grpc_go_project/gateway/etc/certs/ca.crt"
  # Admin 服务端证书的 DNS SAN 必须包含 admin-service。
  server_name: "admin-service"
  # 本地测试约定：客户端证书有效期90天，CA有效期5年；实际日期在签发时确定。

# Rate Limit Configuration (限流配置)
# Circuit Breaker Configuration (熔断配置)
# Tracing Configuration (链路追踪配置)
tracing:
  enabled: true                     # 是否启用链路追踪
  service_name: "gateway-service"   # 服务名称
  endpoint: "127.0.0.1:4317"        # 本地 Jaeger OTLP gRPC 接收地址
  sampler_type: "const"             # 采样器类型：const, probabilistic, ratelimiting
  sampler_param: 1.0                # 采样参数（const: 0/1, probabilistic: 0.0-1.0）
  use_tls: false                    # 是否启用 TLS（生产环境建议启用）
  ca_file: ""                       # CA 证书文件路径（默认：/etc/certs/gateway/ca.crt）
  cert_file: ""                     # 客户端证书文件路径（双向认证时使用）
  key_file: ""                      # 客户端私钥文件路径（双向认证时使用）
  server_name: "jaeger"             # 仅启用 TLS 时参与服务端证书名称验证

# Anti-Replay Configuration (防重放配置)
