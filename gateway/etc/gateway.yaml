# Gateway Service Configuration
environment: "development" # development, staging, production
name: "gateway-service"
host: "127.0.0.1"
port: 9080
grpc_port: 9081
#pprof configuration
pprof:
  enabled: true
  port: 6060
  host: "127.0.0.1"
# Redis Configuration
# 单节点模式：配置host+port，cluster_addresses留空
# 集群模式：配置cluster_addresses，host+port将被忽略
redis:
  host: "127.0.0.1"
  port: 6379
  cluster_addresses: []
  
  db: 0
  pool_size: 100
  min_idle_conns: 10
  max_idle_conns: 50
  conn_max_idle_time: "30m"
  conn_max_lifetime: "1h"
  dial_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"
  pool_timeout: "4s"
  health_required: false # set true in production, or use environment: production

# Gateway authentication configuration. Token values are never stored here.
# Set the JWT verification secret through GATEWAY_ACCESS_TOKEN_SECRET.
auth:
  access_token:
    issuers:
      - "admin-service"
      - "user-service"
    audience: "gateway"
    algorithm: "HS256"
    expire: "15m"
  refresh_token:
    expire: "168h"
    rotate: true
    reuse_detection: true
    redis_key_prefix: "auth:refresh:"
# Consul Configuration
# 单节点模式：配置host+port，addresses留空
# 集群模式：配置addresses，host+port将被忽略
consul:
  host: "localhost"
  port: 8500
  addresses: []
  token: ""
  scheme: "http"
  check_host: "host.docker.internal" # Docker Consul 通过该地址访问 Windows 上的 Gateway
  check_interval: "10s"
  check_timeout: "5s"
  ttl: "30s"
  deregister_critical_after: "90s"
  keepalive_interval: "10s"

# Logger Configuration
logger:
  level: "info"                     # 日志级别：debug, info, warn, error
  format: "json"                    # 日志格式：json, console
  filename: "logs/gateway.log"      # 日志文件路径
  max_size: 100                     # 单个日志文件最大大小（MB）
  max_backups: 10                   # 保留的旧日志文件数量
  max_age: 30                       # 日志文件保留天数
  compress: true                    # 是否压缩旧日志文件

# Service Configuration
service:
  version: "1.0.0"
  cors_enabled: true
  tags:
    - "http"
    - "gateway"
  public_apis:
    - "/health"
  auth_apis: []

# HTTP CORS Configuration
# NewHTTPServer 读取的是顶层 cors，而不是 service.cors。
cors:
  allow_origins:
    - "http://127.0.0.1:3000"
    - "http://localhost:3000"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
    - "X-Request-ID"
  expose_headers:
    - "Content-Length"
    - "Content-Type"
    - "X-Request-ID"
  allow_credentials: true
  max_age: 12

# HTTP 路由不从配置文件动态生成。
# 请在 internal/server/routes_*.go 中按业务模块注册路由。

# Shutdown Configuration
shutdown:
  timeout: "5s"

# gRPC Client Configuration
grpc:
  use_tls: false                    # 是否启用 TLS（生产环境建议启用）
  insecure_skip_verify: false       # 跳过证书验证（仅用于开发/测试）
  cert_file: ""                     # 客户端证书文件路径（默认：/etc/certs/gateway/client.crt）
  key_file: ""                      # 客户端私钥文件路径（默认：/etc/certs/gateway/client.key）
  ca_file: ""                       # CA 证书文件路径（默认：/etc/certs/gateway/ca.crt）
  server_name: "admin-service"      # 验证 Admin gRPC 服务端证书中的名称

# Rate Limit Configuration (限流配置)
rate_limit:
  enabled: true                   # 是否启用限流
  limit: 100                      # 每秒最大请求数
  window: "1m"                    # 时间窗口大小
  redis_timeout: "100ms"          # Redis 连接超时时间
  fail_closed: false              # 开发环境建议 false，生产环境建议 true
#登录接口
login_rate_limit:
  enabled: true                  # 是否启用限流
  limit: 10
  window: "1m"
  redis_timeout: "100ms"
  fail_closed: true

# Circuit Breaker Configuration (熔断配置)
circuit_breaker:
  enabled: true                     # 是否启用熔断
  max_failures: 5                   # 最大连续失败次数
  timeout: "30s"                    # 熔断器打开后的恢复等待时间
  min_requests: 10                  # 半开状态下的最小请求数
  interval: "60s"                   # 统计窗口时间

# Tracing Configuration (链路追踪配置)
tracing:
  enabled: true                     # 是否启用链路追踪
  service_name: "gateway-service"   # 服务名称
  endpoint: "127.0.0.1:4317"        # 本地 Jaeger OTLP gRPC 接收地址
  sampler_type: "const"             # 采样器类型：const, probabilistic, ratelimiting
  sampler_param: 1.0                # 采样参数（const: 0/1, probabilistic: 0.0-1.0）
  use_tls: false                    # 是否启用 TLS（生产环境建议启用）
  ca_file: ""                       # CA 证书文件路径（默认：/etc/certs/gateway/ca.crt）
  cert_file: ""                     # 客户端证书文件路径（双向认证时使用）
  key_file: ""                      # 客户端私钥文件路径（双向认证时使用）
  server_name: "jaeger"             # 仅启用 TLS 时参与服务端证书名称验证

# Anti-Replay Configuration (防重放配置)
anti_replay:
  enabled: false                    # 是否启用防重放（开发环境建议关闭，生产环境启用）
  secret: ""                        # HMAC signature secret; use GATEWAY_ANTI_REPLAY_SECRET in production
  timestamp_tolerance: 300          # 时间戳容差（秒），默认5分钟
  nonce_cache_size: 10000           # Nonce 缓存大小
  nonce_expire_time: 600            # Nonce 过期时间（秒），默认10分钟
  fallback_to_local: true           # development: true; production: false
